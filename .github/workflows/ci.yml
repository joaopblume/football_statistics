name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The unit tests exercise dags/lib/* with mock DB connections and do not
      # import Airflow, so a light install keeps CI fast. (Full Airflow/Spark
      # integration is validated separately via `airflow dags test`.)
      - name: Install lint + test tools
        run: pip install ruff==0.15.4 pytest==8.3.5 pandas==2.3.3

      - name: Lint (ruff)
        run: ruff check dags/ tests/

      - name: Unit tests
        run: pytest tests/ -q
