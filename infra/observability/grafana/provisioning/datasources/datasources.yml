apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: host.docker.internal:5432
    database: futebol-dados
    user: ${PG_USER:-postgres}
    secureJsonData:
      password: ${PG_PASSWORD:-postgres}
    jsonData:
      sslmode: disable
      postgresVersion: 1500
